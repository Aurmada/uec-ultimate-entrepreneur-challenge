<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UEC 3D fighter benchmark</title>
<style>
  body { margin: 0; background: #0b0e1a; color: #dfe6ff; font: 14px system-ui, sans-serif; }
  .modes { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; padding: 10px; }
  .modes a { color: #ffd23f; padding: 8px 12px; border: 1px solid #3a4468; border-radius: 8px; text-decoration: none; }
  .modes a.on { background: #ffd23f; color: #111; }
  canvas { display: block; width: 100%; max-width: 960px; margin: 0 auto; aspect-ratio: 16 / 9; background: #000; }
  #hud { max-width: 960px; margin: 0 auto; padding: 10px; font: 13px/1.45 ui-monospace, monospace; white-space: pre-wrap; }
</style>
</head>
<body>
<!--
  A live AI-vs-AI match with no sign-in, for measuring the 3D fighters on a
  real device. Serve with `python3 dev-server.py 4173` and open
  http://<this machine's LAN address>:4173/lab/gl3d-bench.html on a phone on
  the same network. `detail` adds gl.finish() per 3D fighter, which shows GPU
  time but also costs it, so read fps from the plain modes. The match is in the
  garage, which has a rendered stage: on in the 3D modes as with ?gl, and
  `stages=0` or `stages=1` forces it either way. The hit effects and cut-ins
  follow the same rule, with `fx=0` or `fx=1`, and the stage's depth layers
  (parallax) with `parallax=0` or `parallax=1`, on by default.
-->
<div class="modes">
  <a href="?mode=2d">All 2D</a>
  <a href="?mode=adam">Adam 3D</a>
  <a href="?mode=all">Both 3D</a>
  <a href="?mode=all&amp;detail=1">Both 3D, detail</a>
  <a href="?mode=all&amp;stages=0">Both 3D, no stage</a>
  <a href="?mode=all&amp;fx=0">Both 3D, no effects</a>
  <a href="?mode=all&amp;parallax=0">Both 3D, flat stage</a>
</div>
<canvas id="c"></canvas>
<div id="hud">loading…</div>
<script type="module">
import { STAGE, STAGE_ART } from '../src/config.js';
import { Game } from '../src/engine/game.js';
import { renderGame, RENDER } from '../src/engine/render.js';
import { getFighter } from '../src/data/fighters.js';
import { getArena } from '../src/data/arenas.js';
import { AIController } from '../src/engine/ai.js';
import { enable3D, stats3D } from '../src/engine/gl3d/index.js';
import { STAGES } from '../src/engine/stage.js';
import { FX_STYLE } from '../src/engine/fx.js';

const q = new URLSearchParams(location.search);
const mode = q.get('mode') || 'adam';
const detail = q.has('detail');
document.querySelectorAll('.modes a').forEach((a) => {
  a.classList.toggle('on', a.getAttribute('href') === location.search || (!location.search && a.textContent === 'Adam 3D'));
});
if (mode !== '2d') enable3D({ ids: mode === 'adam' ? ['max'] : null, timing: detail });
// Every mode composites the same way, so 2D and 3D are compared on equal terms;
// &sharp=0 measures the original native-size path instead.
RENDER.sharpFighters = q.get('sharp') !== '0';
STAGES.enabled = q.has('stages') ? q.get('stages') !== '0' : mode !== '2d';
STAGE_ART.PARALLAX = q.get('parallax') !== '0';
FX_STYLE.impact = q.has('fx') ? q.get('fx') !== '0' : mode !== '2d';

const canvas = document.getElementById('c');
const dpr = Math.min(2, window.devicePixelRatio || 1);
canvas.width = STAGE.W * dpr;
canvas.height = STAGE.H * dpr;
const ctx = canvas.getContext('2d');
ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

const HUD = new Proxy({}, { get: () => () => {} });
let game = null;
function newGame() {
  const p1 = getFighter('max'), p2 = getFighter('dex');
  game = new Game({
    p1: { def: p1, controller: new AIController('mogul', p1) },
    p2: { def: p2, controller: new AIController('mogul', p2) },
    arena: getArena('garage'), mode: 'solo', difficulty: 'mogul',
    hud: HUD, onEnd: () => setTimeout(newGame, 0), seed: (Date.now() & 0xffff),
  });
}
newGame();

const frames = [];
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const t0 = performance.now();
  game.update(dt);
  const t1 = performance.now();
  renderGame(ctx, game);
  const t2 = performance.now();
  frames.push({ sim: t1 - t0, render: t2 - t1, gap: dt * 1000 });
  if (frames.length > 300) frames.shift();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

let gpuName = 'unknown GPU';
try {
  const probe = document.createElement('canvas').getContext('webgl2') || document.createElement('canvas').getContext('webgl');
  const ext = probe && probe.getExtension('WEBGL_debug_renderer_info');
  if (probe) gpuName = ext ? probe.getParameter(ext.UNMASKED_RENDERER_WEBGL) : probe.getParameter(probe.RENDERER);
} catch (e) { /* keep the default */ }

const stat = (key) => {
  const s = frames.map((f) => f[key]).sort((a, b) => a - b);
  if (!s.length) return { mean: 0, p95: 0 };
  return { mean: s.reduce((a, b) => a + b, 0) / s.length, p95: s[Math.floor(s.length * 0.95)] };
};
const ms = (v) => v.toFixed(2).padStart(6);
setInterval(() => {
  const r = stat('render'), sim = stat('sim'), gap = stat('gap');
  const st = stats3D();
  const lines = [
    `mode ${mode}${detail ? ' (detail: gl.finish per 3D fighter)' : ''}   sharp ${RENDER.sharpFighters}   stage ${STAGES.enabled}   parallax ${STAGE_ART.PARALLAX}   fx ${FX_STYLE.impact}   models ${JSON.stringify(st.models)}`,
    `device ${navigator.userAgent.replace(/^Mozilla\/5.0 /, '').slice(0, 90)}`,
    `gpu    ${gpuName}   dpr ${dpr}`,
    '',
    `fps          ${(1000 / (gap.mean || 16.7)).toFixed(1)}`,
    `render  ms  mean ${ms(r.mean)}   p95 ${ms(r.p95)}   (whole frame: stage + both fighters + effects)`,
    `sim     ms  mean ${ms(sim.mean)}   p95 ${ms(sim.p95)}`,
  ];
  if (st.timing) {
    const t = st.timing;
    if (t.fighter3d) lines.push(`3D fighter   solve ${ms(t.fighter3d.solve)}  gpu ${ms(t.fighter3d.gpu)}  blit ${ms(t.fighter3d.blit)}  total ${ms(t.fighter3d.total)}`);
    if (t.fighter2d) lines.push(`2D fighter   draw  ${ms(t.fighter2d.draw)}`);
  }
  document.getElementById('hud').textContent = lines.join('\n');
}, 500);
</script>
</body>
</html>
