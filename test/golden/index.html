<meta charset="utf-8">
<title>UEC golden images</title>
<style>
  body { background: #0b0e1a; color: #eef1ff; font: 14px ui-monospace, monospace; padding: 16px; }
  #out { white-space: pre; line-height: 1.5; }
  .ok { color: #57ff8a; } .bad { color: #ff3d6e; }
  button { font: inherit; padding: 6px 14px; margin-right: 8px; }
</style>
<button id="check">CHECK against baseline</button>
<button id="isolate">CHECK isolation (big bodies first)</button>
<button id="parts">CHECK every part draws</button>
<button id="write">WRITE new baseline</button>
<div id="out">ready</div>
<canvas id="c" width="360" height="380" style="display:none"></canvas>
<script type="module">
import { FIGHTERS } from '../../src/data/fighters.js';
import { drawFighter } from '../../src/engine/drawFighter.js';
import { ATTACKS } from '../../src/config.js';
import { clampBody } from '../../src/engine/proportions.js';
import { hashPixels, CASES } from './hash.js';

const out = document.getElementById('out');
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { willReadFrequently: true });

// Three Math.random() calls sit in the render/update path — hit jitter in
// drawFighter, the unicorn sparkle and the rush spark in fighter.js. Without
// pinning, baselines never reproduce.
const realRandom = Math.random;

// computePose only reads plain fields, so a stub object is enough — no Game
// instance, no controller, no audio.
function stubFighter(def, c) {
  return {
    def, side: 0, x: 180, y: 330, facing: 1,
    state: c.state, stateT: c.stateT ?? 0, walkPhase: c.walkPhase ?? 0,
    airborne: !!c.airborne, crouching: !!c.crouching, movingBack: false,
    unicornT: 0, flashT: 0,
    attack: c.kind ? { ...ATTACKS[c.kind], kind: c.kind, hasHit: false } : null,
  };
}

function keyFor(def, c) {
  return `${def.id}/${c.state}${c.kind ? ':' + c.kind : ''}@${c.t}`;
}

function capture() {
  const result = {};
  Math.random = () => 0.5;
  try {
    for (const def of FIGHTERS) {
      for (const c of CASES) {
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawFighter(ctx, stubFighter(def, c), c.t);
        const px = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
        result[keyFor(def, c)] = hashPixels(px);
      }
    }
  } finally {
    Math.random = realRandom;
  }
  return result;
}

// Exposed so the controller can drive this headlessly instead of clicking.
window.captureGolden = capture;
window.checkGolden = async () => {
  const current = capture();
  const baseline = await fetch('./baseline.json?' + Date.now()).then(r => r.json());
  const keys = [...new Set([...Object.keys(baseline), ...Object.keys(current)])].sort();
  const bad = keys.filter(k => baseline[k] !== current[k]);
  return { total: keys.length, bad, detail: bad.map(k => `${k}: ${baseline[k] ?? '(new)'} → ${current[k] ?? '(gone)'}`) };
};

document.getElementById('check').onclick = async () => {
  const r = await window.checkGolden();
  out.innerHTML = `<span class="${r.bad.length ? 'bad' : 'ok'}">${r.bad.length ? r.bad.length + ' MISMATCH of ' + r.total : 'ALL ' + r.total + ' MATCH'}</span>\n\n`
    + r.detail.join('\n');
};

// Renders extreme bodies first, then re-checks the neutral roster.
//
// This exists because of a real bug: the shading buffer used to be shared and
// grow-only, so once a big-bodied character rendered, every OTHER character's
// shading shifted very slightly — a fighter's look depended on who else was on
// screen. Plain CHECK could never catch it, because no shipped character has a
// non-neutral body yet. This makes the isolation a standing guarantee.
window.checkIsolation = async () => {
  const cv = document.createElement('canvas');
  cv.width = 600; cv.height = 600;
  const cx = cv.getContext('2d');
  const bodies = [
    { height: 1.22, build: 1.25, reach: 1.20, stride: 1.18, shoulders: 1.25, head: 1.12 },
    { height: 0.82, build: 0.85, reach: 0.88, stride: 0.88, shoulders: 0.85, head: 0.90 },
    { height: 1.10, build: 1.00, reach: 1.15, stride: 1.05, shoulders: 1.00, head: 1.00 },
  ];
  for (const body of bodies) {
    drawFighter(cx, { ...stubFighter(FIGHTERS[0], { state: 'idle' }), body: clampBody(body), x: 300, y: 500 }, 0.5);
  }
  return window.checkGolden();
};

document.getElementById('isolate').onclick = async () => {
  const r = await window.checkIsolation();
  out.innerHTML = `<span class="${r.bad.length ? 'bad' : 'ok'}">${r.bad.length
    ? r.bad.length + ' MISMATCH of ' + r.total + ' after big bodies rendered — buffers are leaking between characters'
    : 'ISOLATED — all ' + r.total + ' still match after extreme bodies rendered'}</span>\n\n`
    + r.detail.join('\n');
};

// Renders every declared part twice — once alone, once with parts stripped —
// and counts how many pixels differ between the two. A part that never
// changes a pixel is a part that never drew, but "never zero" is too weak a
// bar: Scam's first paperclip traced the wire's centreline instead of its
// outline, self-intersected, and filled to 118 visible pixels — technically
// non-zero, and on screen nothing. 400px is the bar a real prop clears.
const PART_MIN_PIXELS = 400;

function countDiffPixels(a, b) {
  let n = 0;
  for (let i = 0; i < a.length; i += 4) {
    if (a[i] !== b[i] || a[i + 1] !== b[i + 1] || a[i + 2] !== b[i + 2] || a[i + 3] !== b[i + 3]) n++;
  }
  return n;
}

function renderPixels(def, c) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawFighter(ctx, stubFighter(def, c), c.t);
  return ctx.getImageData(0, 0, canvas.width, canvas.height).data;
}

// CONTRAST — reported, not enforced. Read this whole comment before adding a
// threshold; the short version is at the bottom.
//
// countDiffPixels only asks "did this part change any byte". That is size and
// occlusion, and it is blind to colour: a part painted one shade off the body
// underneath it changes every byte the pixel count wants and still reads as
// nothing on screen. Three shipped bugs prove it — max/mat, eleanor/coat and
// eleanor/tablet were all "present but invisible" fixes that were really just
// a fill token one step away from disappearing again, and every one of them
// clears PART_MIN_PIXELS today (1915px, 2364px, 1655px). The pixel count would
// not catch a regression back to the broken colour on any of the three.
//
// This computes the mean RGB distance between the with-part and without-part
// renders, restricted to pixels where the BODY was already opaque before the
// part drew (i.e. pixels the part actually occludes, not pixels where it
// extends past the silhouette into what was transparent canvas). Those
// extension pixels have no "before" colour to compare against — their
// distance is either meaningless or enormous depending on how you define
// distance-from-transparent — and they are already the pixel count's job, so
// they are excluded here rather than double-counted or faked.
//
// Restricting to CHANGED pixels (not every opaque body pixel in frame) matters
// just as much: the canvas is mostly body and background that the part never
// touches, and averaging over the whole frame would dilute any real signal
// into noise — a part covering 2000px of a 136800px canvas would score
// ~99% "no change" no matter how badly it blended. One edge case follows from
// using "changed" as the footprint proxy: a pixel where the part's colour is
// an EXACT match for the body underneath is indistinguishable from a pixel
// the part never reached at all, so it is excluded too — that pixel would
// have contributed a distance of 0 anyway, so leaving it out only makes an
// already-bad score look very slightly better, never worse. It does not
// affect any of the three real bugs above, none of which were an exact match.
//
// A part that overlaps no opaque body pixel at all (drawn entirely off the
// silhouette, e.g. a prop held out past the reach limit) is reported as
// "no overlap", not scored zero and failed — it has nothing to blend into by
// definition, and that is not the failure this metric is built to catch.
function contrastForPart(withPart, without) {
  let sum = 0, n = 0;
  for (let i = 0; i < without.length; i += 4) {
    if (without[i + 3] === 0) continue; // transparent before the part — the pixel count's job, not this one's
    if (withPart[i] === without[i] && withPart[i + 1] === without[i + 1]
      && withPart[i + 2] === without[i + 2] && withPart[i + 3] === without[i + 3]) continue; // part never touched (or matched exactly) this pixel
    const dr = withPart[i] - without[i], dg = withPart[i + 1] - without[i + 1], db = withPart[i + 2] - without[i + 2];
    sum += Math.sqrt(dr * dr + dg * dg + db * db);
    n++;
  }
  return n === 0 ? { overlap: 0, mean: null } : { overlap: n, mean: sum / n };
}
// THE THRESHOLD, or the deliberate lack of one: base fill hex alone gives a
// tempting number. suit2 (#d15505) vs the suit underneath it (#ff7a1a) on
// max's original mat is Euclidean RGB distance ~63; the shipped fix, shoe
// (#f5f5f5) on the same suit, is ~251. eleanor's original coat, suit2
// (#111a3d) against the pants underneath it (#141d42), is ~7; hair
// (#f2ece0) on the same pants is ~342. eleanor's original tablet, suit2 vs
// the suit (#1c2a5e), is ~38; accent (#ffd23f) is ~284. Every known-broken
// case sits under 65 and every known-fixed one sits over 250 — a huge gap,
// and a threshold somewhere in between looks obviously justified.
// It is not, and here is why: those numbers are the DECLARED fill colours,
// and no part ever reaches the canvas as its declared colour. `drawFighter`
// composites everything inside an offscreen buffer and then runs
// `shadeBuffer()` over the whole silhouette — key light, mid/floor gradients,
// side gradients, rim light (see ARCHITECTURE.md §7) — before any pixel is
// read. That pass is why the same `suit2` hex reads differently on different
// characters and different states in the first place. The three known pairs
// above are the only data point I have without opening a browser, which this
// task does not permit, and three anecdotes from PRE-shading hex codes are
// not enough to justify a number that will DECIDE pass/fail against the
// POST-shading pixels the metric actually measures. An unjustified threshold
// that fails a good part is worse than no threshold, so this ships
// REPORTED-BUT-NOT-ENFORCED: `checkParts` prints the contrast figure next to
// every part and never adds it to `bad`. Whoever next has a real browser
// should run this against the shipped roster, look at the actual distribution
// of post-shading numbers, and pick a threshold from THAT — not from this
// comment.
//
// LIMITATION this metric cannot see at all: the canvas here is transparent,
// with no arena behind the fighter. Half of the eleanor/coat bug was suit2
// against a dark NAVY ARENA, not just against her own suit — "dark part on
// dark stage" needs a real background to measure and this harness never
// draws one. `lab/silhouette.js` and `lab/contrast.js` measure fighter-vs-
// stage contrast in a live match; this file only ever measures fighter-vs-
// fighter (a part against the body it sits on). Do not read a good score here
// as "this part is visible in an arena" — it only means "this part doesn't
// vanish into its own wearer".
const PART_CONTRAST_ENFORCED = false; // see the comment above before flipping this on

function contrastLabel(part) {
  return part.overlap === 0 ? 'no overlap with body' : `contrast ${part.mean.toFixed(1)} over ${part.overlap}px`;
}

window.checkParts = async () => {
  const detail = [];
  const bad = [];
  const parts = [];
  let min = Infinity;
  Math.random = () => 0.5;
  try {
    for (const def of FIGHTERS) {
      if (!def.parts || !def.parts.length) continue;
      for (const part of def.parts) {
        // No `states` means the part is always on, so any case will do — an
        // idle one keeps this close to how the part is normally seen.
        const states = part.states || ['idle'];
        const c = CASES.find(cc => states.includes(cc.state));
        const key = `${def.id}/${part.id}`;
        if (!c) { detail.push(`${key}: NO CASE covers states ${JSON.stringify(states)}`); bad.push(key); continue; }
        const withPart = renderPixels({ ...def, parts: [part] }, c);
        const without = renderPixels({ ...def, parts: [] }, c);
        const diff = countDiffPixels(withPart, without);
        const contrast = contrastForPart(withPart, without);
        min = Math.min(min, diff);
        // PART_CONTRAST_ENFORCED is false — see the comment above contrastForPart.
        // Contrast is reported in `detail`/`parts` but never joins `bad`.
        const pass = diff >= PART_MIN_PIXELS;
        if (!pass) bad.push(key);
        parts.push({ key, state: c.state, diffPixels: diff, pass, overlapPixels: contrast.overlap, contrastMean: contrast.mean });
        detail.push(`${key} @ ${c.state}: ${diff}px${pass ? '' : ' — FAIL (< ' + PART_MIN_PIXELS + 'px)'} — ${contrastLabel(contrast)}`);
      }
    }
  } finally {
    Math.random = realRandom;
  }
  return { total: detail.length, bad, min: Number.isFinite(min) ? min : 0, detail, parts };
};

document.getElementById('parts').onclick = async () => {
  const r = await window.checkParts();
  out.innerHTML = `<span class="${r.bad.length ? 'bad' : 'ok'}">${r.bad.length
    ? r.bad.length + ' of ' + r.total + ' parts FAILED to draw'
    : 'all ' + r.total + ' parts draw (min ' + r.min + 'px)'}</span>\n\n`
    + r.detail.join('\n');
};

document.getElementById('write').onclick = async () => {
  const body = JSON.stringify(capture(), null, 2);
  const res = await fetch('./baseline.json', { method: 'PUT', body });
  out.textContent = res.ok ? 'baseline written — commit it' : 'PUT failed: run under dev-server.py';
};
</script>
